<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">
    <mat-drawer-container  class="flex-auto h-full bg-card dark:bg-transparent" (backdropClick)="onBackdropClicked()">
        <mat-drawer #matDrawer  class="w-full sm:w-128 dark:bg-gray-900"
            [mode]="'over'"
            [opened]="false"
            [position]="'end'"
            [disableClose]="true">
            <div class="flex flex-auto">
                <form class="flex flex-col flex-auto p-6 pt-10 sm:p-8 sm:pt-10 overflow-y-auto" [formGroup]="panelForm" #panelNgForm="ngForm">
            
                    <!-- Header -->
                    <div class="flex items-center justify-between -mt-3 -ml-4">
            
                                <div class="flex items-center justify-center">
                                    <h1 class="ml-2 font-semibold text-4xl font-extrabold tracking-tight leading-none">{{isEdit ? "Edit":"Add"}} Panel</h1>
                                </div>
            
                        <div class="flex items-center">
                            <!-- Close button -->
                            <button mat-icon-button (click)="onBackdropClicked()">
                                <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
                            </button>
                        </div>
            
                    </div>
            
                    <mat-divider class="mt-6 mb-8"></mat-divider>
            
                    <mat-form-field class="w-full">
                        <mat-label>Panel name</mat-label>
                        <input id="name" matInput [formControlName]="'panel_name'">
                        <mat-error *ngIf="panelForm.get('panel_name').hasError('required')">
                                    Panel name is required
                                </mat-error>
                    </mat-form-field>
                    
                    <div class="space-y-4">
                        <ng-container
                            *ngFor="let item of panelForm.get('ip_address')['controls']; let i = index; let first = first; let last = last">
                            <div class="flex">
                                <mat-form-field class="fuse-mat-no-subscript flex-auto">
                                    <mat-label *ngIf="first">IP</mat-label>
                                    <input matInput [formControl]="item.get('ip')" [placeholder]="'IP address'" [spellcheck]="false">
                                </mat-form-field>
                                <mat-form-field class="fuse-mat-no-subscript flex-auto w-full max-w-24 sm:max-w-40 ml-2 sm:ml-4">
                                    <mat-label *ngIf="first">Port</mat-label>
                                    <input matInput [formControl]="item.get('port')" [placeholder]="'Port'">
                                </mat-form-field>
                                <!-- Remove item -->
                                <ng-container *ngIf="!(first && last)">
                                    <div class="flex items-center w-10 pl-2" [ngClass]="{'mt-6': first}">
                                        <button class="w-8 h-8 min-h-8" mat-icon-button (click)="removeIPAddressField(i)" matTooltip="Remove">
                                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:trash'"></mat-icon>
                                        </button>
                                    </div>
                                </ng-container>
                            </div>
                        </ng-container>
                    </div>
                    <div class="group inline-flex items-center mt-2 -ml-4 py-2 px-4 rounded cursor-pointer"
                        (click)="addIPAddressField()">
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:plus-circle'"></mat-icon>
                        <span class="ml-2 font-medium text-secondary group-hover:underline">Add a IP address</span>
                    </div>
                    
                        <div class="flex flex-col">
                            <mat-label>Status</mat-label>
                            <mat-slide-toggle [formControlName]="'active'" [color]="'primary'">
                                {{panelForm.get('active').value === true ? 'Active' : 'Disabled'}}
                            </mat-slide-toggle>
                        </div>

                    <button type="submit" class="fuse-mat-button-large w-full mt-6" mat-flat-button [color]="'primary'" [disabled]="panelForm.disabled"
                        (click)="onSubmit()">
                        <span *ngIf="!panelForm.disabled">
                           Submit
                        </span>
                        <mat-progress-spinner *ngIf="panelForm.disabled" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
                    </button>
                   
                </form>
            
            </div>  
        </mat-drawer>
            <mat-drawer-content class="flex flex-col">
                <!-- Header -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between py-8 px-6 md:px-8">
                    <!-- Title -->


                        <div class="text-4xl font-extrabold tracking-tight leading-none">Panels</div>
                    <!-- Actions -->
                    <div class="mt-4 sm:mt-0">
                        <!-- Add section button -->
                        <!-- <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded min-w-64">
                            <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:search'"></mat-icon>
                            <input matInput  [autocomplete]="'off'"
                                [placeholder]="'Search users'">
                        </mat-form-field> -->
                        <!-- Add task button -->
                        <button class="ml-3" mat-flat-button [color]="'primary'" (click)="openDrawer()"
                            >
                            <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                            <span class="ml-2 mr-1">Add Panel</span>
                        </button>
                    </div>
                </div>
                <div class="relative inset-x-0 bottom-0" *ngIf="isLoading">
                    <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
                </div>


            <div class="flex flex-auto overflow-hidden">
                <div class="flex flex-col flex-auto sm:mb-18 overflow-hidden sm:overflow-y-auto">
                    <div class="overflow-x-auto mx-6">
                        <table class="min-w-full overflow-y-visible" mat-table [dataSource]="panelsDataSource"
                        #panelsTable>
                
                            <!-- Type -->
                            <ng-container matColumnDef="panel_name" sticky>
                                <th mat-header-cell *matHeaderCellDef>
                                    Panel Name
                                </th>
                                <td mat-cell *matCellDef="let item">
                                {{item.panel_name}}
                                </td>
                            </ng-container>
                
                            <ng-container matColumnDef="ip_address">
                                <th mat-header-cell *matHeaderCellDef>
                                IP Address
                                </th>
                                <td mat-cell *matCellDef="let item">
                                    <ng-container *ngIf="item.ip_address.length">
                                        <div class="flex mt-3 mb-3">
                                            <div class="min-w-0 space-y-1">
                                                <ng-container *ngFor="let val of item.ip_address">
                                                    <div class="flex items-center leading-6">
                                                        {{val.ip}}
                                                        <div class="text-md truncate text-secondary">
                                                            <span class="mx-2">-</span>
                                                            <span class="font-medium">{{val.port}}</span>
                                                        </div>
                                                    </div>
                                                </ng-container>
                                            </div>
                                        </div>
                                    </ng-container>
                                </td>
                            </ng-container>
                
                            <ng-container matColumnDef="active">
                                <th mat-header-cell *matHeaderCellDef>
                                    Active
                                </th>
                                <td mat-cell *matCellDef="let item">
                                    <ng-container *ngIf="item.active">
                                        <mat-icon class="text-green-400 icon-size-5" [svgIcon]="'heroicons_solid:check'"></mat-icon>
                                    </ng-container>
                                    <ng-container *ngIf="!item.active">
                                        <mat-icon class="text-gray-400 icon-size-5" [svgIcon]="'heroicons_solid:x'"></mat-icon>
                                    </ng-container>
                                </td>
                            </ng-container>
                
                            <ng-container matColumnDef="action">
                                <th mat-header-cell *matHeaderCellDef>
                                   Action
                                </th>
                                <td mat-cell *matCellDef="let item">
                                    <button class="w-8 h-8 min-h-8" mat-icon-button (click)="onEdit(item)">
                                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:pencil-alt'"></mat-icon>
                                    </button>
                                    <button class="w-8 h-8 min-h-8" mat-icon-button (click)="onDelete(item)">
                                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:trash'"></mat-icon>
                                    </button>
                                </td>
                            </ng-container>
                            <tr mat-header-row *matHeaderRowDef="panelsTableColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: panelsTableColumns;"></tr>
                        </table>
                    </div>
                    <!-- <mat-paginator
                        class="sm:absolute sm:inset-x-0 sm:bottom-0 border-b sm:border-t sm:border-b-0 z-10 bg-gray-50 dark:bg-transparent"
                        [ngClass]="{'pointer-events-none': isLoading}" [length]="panels.length" [pageIndex]="'0'" [pageSize]="'10'"
                        [pageSizeOptions]="[5, 10, 25, 100]" [showFirstLastButtons]="true"></mat-paginator> -->
                </div>
            </div>
            </mat-drawer-content>
    </mat-drawer-container>
</div>
